name: Update CLAUDE.md

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  update-claude-md:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Update CLAUDE.md from Actions
        uses: ./
        with:
          actions: |
            actions/checkout
            actions/setup-node
          github-token: ${{ secrets.GITHUB_TOKEN }}
